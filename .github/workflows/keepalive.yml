name: keepalive
# Render's free tier sleeps after ~15 min idle; a cold start takes 30-50 s. Ping /healthz so judges never hit it.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 5 -m 60 https://gravity-duel-m3pr.onrender.com/healthz
